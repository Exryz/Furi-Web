<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sousou no Frieren</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullpage Background Wallpaper (Slightly Blurred) -->
  <div class="bg-wallpaper"></div>

  <!-- Weather Widget -->
  <div class="weather-widget">
    <div class="weather-summary">
      <span class="weather-icon" id="weather-icon">☼</span>
      <span class="weather-city">Bauan</span>
      <span class="weather-temp" id="weather-temp">26°</span>
    </div>
    <div class="weather-sub" id="weather-feels">33° Feels like</div>
    <div class="weather-sub" id="weather-humidity">96% Humidity</div>
  </div>

  <!-- Main Center Stack -->
  <div class="stage">

    <!-- 1. Time & Date -->
    <div class="time-widget">
      <div class="time-digits" id="clock-digits">00:00:00</div>
      <div class="time-date" id="clock-date">Thursday, October 16</div>
      <hr class="time-divider">
    </div>

    <!-- 2. Central Artwork Card -->
    <div class="banner-stage">
      <div class="banner-layer-a"></div>
      <div class="banner-layer-b"></div>
    </div>

    <!-- 3. Search Capsule -->
    <form class="search-form" id="search-form">
      <input type="text" class="search-input" id="search-input" placeholder="Type to search" autocomplete="off" spellcheck="false" autofocus>
    </form>

    <!-- 4. Quick Navigation Links Grid -->
    <div class="links-grid">
      <a href="https://www.youtube.com">youtube</a>
      <a href="https://www.netflix.com">netflix</a>
      <a href="https://miruro.tv">miruro</a>
      <a href="https://1shows.org">1shows</a>
      <a href="https://discord.com">discord</a>
      <a href="https://www.facebook.com">facebook</a>
      <a href="https://www.instagram.com">instagram</a>
      <a href="https://open.spotify.com">spotify</a>
      <a href="https://mail.google.com">gmail</a>
      <a href="https://outlook.live.com">outlook</a>
      <a href="https://www.reddit.com">reddit</a>
      <a href="https://notion.so">notion</a>
      <a href="https://github.com">github</a>
      <a href="https://www.figma.com">figma</a>
      <a href="https://claude.ai">claude</a>
      <a href="https://workday.com">workday</a>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
