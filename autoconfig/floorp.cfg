// Furi-Web (フリー・ウェブ) Window Title & Icon Override (Line 1 must be a comment)
try {
  const FURI_WEB = "\u30D5\u30EA\u30FC\u30FB\u30A6\u30A7\u30D6";
  const DARK_ICON_DATA_URI = "data:image/png;base64,";
  const Cc = globalThis.Cc || Components.classes;
  const Ci = globalThis.Ci || Components.interfaces;
  let gIconPromise = null;

  const getDarkIconImage = () => {
    if (!gIconPromise) {
      const p = (async () => {
        const uri = Services.io.newURI(DARK_ICON_DATA_URI);
        try {
          const { TaskbarTabsUtils } = ChromeUtils.importESModule("resource:///modules/taskbartabs/TaskbarTabsUtils.sys.mjs");
          return await TaskbarTabsUtils._imageFromLocalURI(uri);
        } catch (e) {
          const channel = Services.io.newChannelFromURI(
            uri,
            null,
            Services.scriptSecurityManager.getSystemPrincipal(),
            null,
            Ci.nsILoadInfo.SEC_ALLOW_CROSS_ORIGIN_SEC_CONTEXT_IS_NULL,
            Ci.nsIContentPolicy.TYPE_IMAGE
          );
          return await ChromeUtils.fetchDecodedImage(uri, channel);
        }
      })().catch((err) => {
        if (gIconPromise === p) {
          gIconPromise = null;
        }
        throw err;
      });
      gIconPromise = p;
    }
    return gIconPromise;
  };

  const applyWindowIcon = (win) => {
    if (!win || win.closed) return;
    getDarkIconImage().then((img) => {
      if (!win || win.closed || !img) return;
      try {
        const winUtils = Cc["@mozilla.org/windows-ui-utils;1"].getService(Ci.nsIWindowsUIUtils);
        winUtils.setWindowIcon(win, img, img);
      } catch (e) {}
    }).catch(() => {});
  };

  // A. Patch Tabbrowser.prototype.getWindowTitleForBrowser globally
  try {
    const { Tabbrowser } = ChromeUtils.importESModule("moz-src:///browser/components/tabbrowser/Tabbrowser.sys.mjs");
    if (Tabbrowser && Tabbrowser.prototype) {
      const origGetTitle = Tabbrowser.prototype.getWindowTitleForBrowser;
      Tabbrowser.prototype.getWindowTitleForBrowser = function(browser) {
        const raw = origGetTitle.call(this, browser);
        return raw ? raw.replace(/Ablaze Floorp|Floorp/g, FURI_WEB) : FURI_WEB;
      };
      const origUpdate = Tabbrowser.prototype.updateTitlebar;
      Tabbrowser.prototype.updateTitlebar = function() {
        origUpdate.call(this);
        if (this.document && this.document.title) {
          const fixed = this.document.title.replace(/Ablaze Floorp|Floorp/g, FURI_WEB);
          if (this.document.title !== fixed) {
            this.document.title = fixed;
          }
        }
      };
    }
  } catch (e) {}

  // B. Patch every opened browser window DOM, titlebar & HWND icon
  const patchWindow = (win) => {
    if (!win || !win.document) return;
    const applyBrand = () => {
      try {
        const doc = win.document;
        for (const id of ["mainWindowTitle", "privateWindowTitle"]) {
          const el = doc.getElementById(id);
          if (el) {
            el.removeAttribute("data-l10n-id");
            el.textContent = FURI_WEB;
          }
        }
        if (doc.documentElement) {
          for (const attr of ["data-title-default", "data-title-private", "title", "title_normal"]) {
            if (doc.documentElement.hasAttribute(attr)) {
              doc.documentElement.setAttribute(attr, FURI_WEB);
            }
          }
        }
        if (win.gBrowser && win.gBrowser.updateTitlebar) {
          win.gBrowser.updateTitlebar();
        }
        if (doc.title) {
          const fixed = doc.title.replace(/Ablaze Floorp|Floorp/g, FURI_WEB);
          if (doc.title !== fixed) {
            doc.title = fixed;
          }
        }
        applyWindowIcon(win);
      } catch (e) {}
    };
    applyBrand();
    win.addEventListener("DOMContentLoaded", applyBrand, { once: true });
    win.addEventListener("load", () => {
      applyBrand();
      win.setTimeout(applyBrand, 200);
      win.setTimeout(applyBrand, 800);
      win.setTimeout(applyBrand, 2000);
    }, { once: true });
  };

  Services.obs.addObserver((subject) => {
    patchWindow(subject);
  }, "browser-delayed-startup-finished");

  Services.obs.addObserver((subject) => {
    patchWindow(subject);
  }, "chrome-document-global-created");
} catch (e) {}